# Единый способ запуска: docker compose up --build  →  http://localhost:8080
name: alfa-smart-credit-cabinet

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://credit:${POSTGRES_PASSWORD:-credit}@db:5432/credit
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  MOCK_GATEWAY_URL: http://mock-gateway:8081
  PIPELINE_STEP_DELAY_S: ${PIPELINE_STEP_DELAY_S:-1.5}
  LLM_ENABLED: ${LLM_ENABLED:-false}
  LLM_URL: http://ollama:11434
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b}

services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: credit
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit -d credit"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  mock-gateway:
    build: ./mock-gateway
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      <<: *backend-env
      SEED_ON_START: "true"
    depends_on:
      db: {condition: service_healthy}
      mock-gateway: {condition: service_started}
    ports: ["8000:8000"]
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
    depends_on:
      api: {condition: service_healthy}
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    healthcheck:
      disable: true
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      api: {condition: service_healthy}
    ports: ["8080:80"]
    restart: unless-stopped

  # Опционально: LLM-ассистент на open-weights модели. Запуск: docker compose --profile ai up
  ollama:
    image: ollama/ollama:0.5.4
    profiles: ["ai"]
    volumes: [ollama:/root/.ollama]
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull ${LLM_MODEL:-qwen2.5:1.5b}; wait"]

volumes:
  pgdata:
  ollama:
