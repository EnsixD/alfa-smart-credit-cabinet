# Версионируемый набор правил кредитного решения.
# Каждое решение сохраняет version — по нему можно воспроизвести и объяснить результат.
version: "2026.10-1"

scorecard:
  base: 500
  business_age_months:          # возраст бизнеса
    - {max: 12, points: -40, label: "Бизнесу меньше года"}
    - {max: 36, points: 20, label: "Бизнесу 1–3 года"}
    - {max: 99999, points: 60, label: "Бизнесу больше 3 лет"}
  profit_margin:                # (выручка - расходы) / выручка
    - {max: 0.0, points: -80, label: "Расходы превышают выручку"}
    - {max: 0.08, points: 0, label: "Низкая рентабельность"}
    - {max: 0.2, points: 40, label: "Нормальная рентабельность"}
    - {max: 99, points: 60, label: "Высокая рентабельность"}
  revenue_trend:                # выручка текущего года / прошлого года - 1
    - {max: -0.2, points: -50, label: "Выручка падает более чем на 20%"}
    - {max: 0.0, points: -10, label: "Выручка немного снизилась"}
    - {max: 99, points: 30, label: "Выручка растёт"}
  dscr:                         # чистый денежный поток / все платежи по долгам (с учётом нового)
    - {max: 1.0, points: -120, label: "Денежного потока не хватает на платежи"}
    - {max: 1.25, points: -40, label: "Платежи почти полностью съедают поток"}
    - {max: 2.0, points: 30, label: "Комфортная долговая нагрузка"}
    - {max: 9999, points: 70, label: "Низкая долговая нагрузка"}
  amount_to_revenue:            # сумма кредита / годовая выручка
    - {max: 0.25, points: 30, label: "Сумма умеренная относительно выручки"}
    - {max: 0.5, points: 0, label: "Сумма заметная относительно выручки"}
    - {max: 99, points: -50, label: "Сумма велика относительно выручки"}
  bki_overdue_12m:              # число просрочек за 12 мес
    - {max: 0, points: 60, label: "Нет просрочек за год"}
    - {max: 2, points: -40, label: "Были единичные просрочки"}
    - {max: 999, points: -120, label: "Систематические просрочки"}
  bki_history_months:
    - {max: 0, points: -10, label: "Нет кредитной истории"}
    - {max: 24, points: 10, label: "Короткая кредитная история"}
    - {max: 9999, points: 30, label: "Длинная положительная кредитная история"}
  bank_client:                  # обороты по счёту в банке
    client: {points: 30, label: "Есть обороты по счёту в банке"}
    non_client: {points: 0, label: "Нет оборотов по счёту в банке"}
  industry_risk:
    high: {points: -30, label: "Отрасль повышенного риска"}
    medium: {points: 0, label: "Отрасль среднего риска"}
    low: {points: 20, label: "Отрасль низкого риска"}

industries:
  food: medium
  trade: medium
  manufacturing: low
  construction: high
  auto: medium
  it: low
  transport: medium

grades:                         # минимальный балл для рейтинга
  A: 720
  B: 640
  C: 560
  D: 480
  E: 0

rate_premium: {A: 0.0, B: 1.5, C: 3.0, D: 5.0}

policy:
  min_dscr: 1.25                # минимальный допустимый DSCR
  max_unsecured_to_revenue: 0.5 # беззалоговый кредит не больше 50% годовой выручки
  max_current_overdue_days: 30  # текущая просрочка выше — стоп-фактор
  manual_grades: [C]            # такие рейтинги всегда идут к специалисту
  reject_grades: [D, E]
  underwriter_limit: 30000000   # выше — согласование руководителя (APPROVER)
  tax_debt_manual_threshold: 100000
  offer_valid_days: 14
